---
- name: Download SSRS Setup if Needed
  ansible.builtin.include_tasks:
    file: download_file.yml
  vars:
    ludus_scom_file_name: SQLServerReportingServices.exe
    ludus_scom_url: "{{ ssrs_url }}"
    ludus_scom_host_path: "C:\\ludus\\scom"

- name: Install SSRS 
  ansible.windows.win_shell: |
    C:\ludus\scom\SQLServerReportingServices.exe /IAcceptLicenseTerms /quiet /Edition=Eval
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: '{{ ludus_domain_fqdn }}\{{ defaults.ad_domain_admin }}'
    ansible_become_password: '{{ defaults.ad_domain_admin_password }}'
    ansible_become_flags: "logon_type=interactive logon_flags=with_profile"
  args:
    creates: "C:\\Program Files\\Microsoft SQL Server Reporting Services\\Shared Tools\\RSConfigTool.exe"
